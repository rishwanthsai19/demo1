name: Validate HTML & CSS
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validation tools
        run: |
          npm install -g htmlhint
          npm install -g csslint
      - name: Validate HTML files
        run: htmlhint "*.html" --config .htmlhintrc
      - name: Validate CSS files
        # CSSLint (2014) cannot parse CSS variables or grid, so it reports false errors.
        # Kept as a non-blocking warning; swap in stylelint if you want a blocking CSS check.
        run: csslint css/*.css --quiet || echo "::warning::CSSLint reported issues (expected for CSS variables/grid)"
